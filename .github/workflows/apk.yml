name: App Android

on:
  push:
    branches: [main]
    paths: ["index.html", "config.js", "icon.svg", "package.json", "capacitor.config.json", "scripts/**", "android-res/**", ".github/workflows/apk.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Montar o projeto Android
        run: |
          npm run app:preparar
          npx cap add android
          cp -r android-res/. android/app/src/main/res/
          npx cap sync android

      - name: Chave de assinatura
        env:
          KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            mkdir -p ~/.android
            echo "$KEYSTORE" | base64 -d > ~/.android/debug.keystore
            echo "Usando a chave do repositório"
          else
            echo "Sem chave salva: o APK sai com uma chave temporária"
          fi

      - name: Gerar APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Publicar APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk caixa.apk
          gh release view apk >/dev/null 2>&1 || gh release create apk --title "App Android" --notes "APK gerado automaticamente a cada atualização do app. Baixe o caixa.apk e instale no celular."
          gh release upload apk caixa.apk --clobber
